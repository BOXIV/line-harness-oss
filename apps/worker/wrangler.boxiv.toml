# BOXIV-specific Wrangler config (line-connect on boxiv.workers.dev).
#
# Why this file exists:
#   apps/worker/wrangler.toml is shared with the OSS upstream and uses the
#   "line-harness" naming. To keep upstream merges clean, BOXIV-specific
#   resource names live here and are passed via `wrangler deploy --config`.
#
# Production deploy (run from line/line-harness-oss/apps/worker):
#   pnpm exec vite build
#   pnpm exec wrangler deploy --config wrangler.boxiv.toml
#
# After creating the new D1 in the BOXIV account, replace database_id below
# with the value returned by `wrangler d1 create line-connect`.

name = "line-connect"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
account_id = "e839830b4102c24f0d03834e09d8b101"

[assets]
not_found_handling = "single-page-application"

[vars]
# 本番 Login チャネル(2010320277)に登録済みのコールバックURLは
#   https://line-connect.boxiv.workers.dev/listing-form/callback
#   https://line-connect.boxiv.workers.dev/auth/callback
# の2本のみで、/link/callback は未登録。未登録の redirect_uri で authorize を叩くと
# LINE が 400 Bad Request を返し、出品フォーム/アプリ出品の LINE 連携が全滅する
# （実障害 2026-08-03〜08-06。test チャネル(2009711299)には登録済みで再現しなかった）。
# → console に https://line-connect.boxiv.workers.dev/link/callback を追加したら
#   この行を削除して正 URL(/link/callback)へ戻す。callback は新旧どちらでも受けられる。
LINE_LOGIN_CALLBACK_PATH = "/listing-form/callback"

# ── 管理画面ログイン（メール認証コード）のスロットル ─────────────────────────
# ⚠️ [vars] は test / prod で共有される。deploy-boxiv-test.mjs が上書きするのは
#    name / d1_databases / r2_buckets の 3 つだけで、vars は素通りする。
#    環境ごとに違う値が要るもの（ADMIN_BASE_URL）は vars ではなく wrangler secret に置くこと。
#    スロットルの数値は両環境で同じであるべきなので vars が正しく、読み出せる利点もそのまま効く。
#
# 明示するのはこの 1 つだけ。「絞りすぎると共有回線の締め出しが別の形で戻る」性質があり、
# 実運用で噛んだときにデプロイだけで緩められるよう、既定値でも書いておく。
# 100 の根拠: 正規の最悪ケース（9 名が同じプレフィクスから各自 5 回まで再送）= 45 回の 2 倍。
# IPv6 は /64 に丸めるのでオフィス全体が 1 枠を共有する点に注意。
ADMIN_LOGIN_ISSUE_MAX_PER_IP_TOTAL = "100"

# 以下は **既定のままにすることを検討したうえで選んでいる**（未設定＝未検討ではない）。
# 変えたくなったらここに書き足す。既定値は packages/db/src/staff-auth.ts。
#   ADMIN_LOGIN_CODE_TTL_MINUTES     = "10"   コードの有効期限
#   ADMIN_LOGIN_MAX_ATTEMPTS         = "5"    1 チャレンジあたりの検証試行上限
#   ADMIN_LOGIN_ISSUE_MAX            = "10"   アカウント単位の発行上限
#   ADMIN_LOGIN_ISSUE_MAX_PER_IP     = "5"    (プレフィクス × 宛先メール) 単位の発行上限
#   ADMIN_LOGIN_ISSUE_WINDOW_MINUTES = "15"   発行系の窓
#   ADMIN_LOGIN_FAIL_MAX_PER_IP      = "20"   プレフィクス単位の検証失敗上限
#     ⚠️ この上限だけでは「第三者による一時的なログイン封じ」は防げない。
#        不一致時の加算は生存中のチャレンジ全件に +1 なので、5 回の失敗バーストで
#        その時点のコードが本数に関係なく全部ロックされる（実測）。20 は「4 本焼ける」ではなく
#        「4 回バーストできる」の意味。本人が再送を押して発行枠を先に使い切っていると
#        1 バーストで窓を潰される。実害の上限は窓 15 分の一時的なログイン不能で、
#        Slack には鳴り、救済コード発行の経路も生きている。詳細は staff-auth.ts のコメント。
#   ADMIN_LOGIN_FAIL_WINDOW_MINUTES  = "15"   検証失敗の窓
#   ADMIN_SESSION_TTL_HOURS          = "168"  セッションの絶対期限（7日 / iOS Safari の保存期間に合わせる）

[[d1_databases]]
binding = "DB"
database_name = "line-connect"
database_id = "8f93ece4-0bda-4d92-8836-3a51737213db"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-connect-images"

# Worker ログ（console.error 等）を保持する。無効だと障害の事後追跡ができない
# — 実例: 診断フォームの spec_API 失敗（2026-08-01, lead 537809e3-…）は
# console.error がどこにも残っておらず、原因を断定できなかった。
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# cron はアカウントの 5 トリガー上限対策で単一に集約。scheduled() が scheduledTime で分岐:
#   毎分=Slackバースト flush / 5分ごと=配信ジョブ / 12時間ごと=Notion reconcile
crons = ["* * * * *"]
