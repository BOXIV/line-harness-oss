name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
account_id = "e839830b4102c24f0d03834e09d8b101"

# Static assets (LIFF pages) served by Workers Assets
# SPA fallback ensures all non-API paths serve index.html
[assets]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "e62fc90a-b94e-46f4-a123-70ed1abc617e"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *"]

# Test environment is NOT defined here because @cloudflare/vite-plugin
# strips [env.*] sections from the generated dist/line_harness/wrangler.json.
# Use `pnpm --filter worker deploy:test` (scripts/deploy-test.mjs) instead,
# which patches the generated config to point at line-harness-test resources.
